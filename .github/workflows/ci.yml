name: Validar dashboard

on:
  push:
    branches: [main, sprint-5-dashboard]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Verificar sintaxe Python
        run: python -m compileall -q app.py scripts/download_data.py tests/
      - name: Testes automáticos do projeto
        run: python -m unittest discover -s tests -v
